<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de tareas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <main class="tablero">
    <h1>Gestor de tareas</h1>
    <p class="pendientes">
      Tareas pendientes: <strong id="contador">0</strong>
    </p>

    <form id="formulario" class="formulario">
      <label for="entrada" class="solo-lectores">Nueva tarea</label>
      <input type="text" id="entrada" placeholder="Escribe una tarea y presiona Enter" autocomplete="off">
      <button type="submit">Agregar tarea</button>
    </form>
    <ul id="lista" class="lista"></ul>
    <button type="button" id="limpiar" class="limpiar" hidden>Limpiar completadas</button>
    <p id="vacio" class="vacio">No hay tareas. Agrega la primera arriba.</p>

  </main>

  <script src="js/app.js"></script>
</body>

</html>
